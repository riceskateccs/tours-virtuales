<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tours Virtuales 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: white; font-family: sans-serif; overflow: hidden; }
    canvas { width: 100vw !important; height: 100vh !important; display: block; }
    #ui {
      position: fixed; top: 20px; left: 20px;
      background: rgba(0,0,0,0.6); padding: 16px;
      border-radius: 12px; backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); z-index: 10;
    }
    #ui h2 { font-size: 15px; margin-bottom: 10px; color: #a78bfa; }
    #ui p  { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
    #upload-btn {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: #7c3aed; color: white;
      border: none; padding: 14px 32px;
      border-radius: 999px; cursor: pointer;
      font-size: 15px; font-weight: 600;
      box-shadow: 0 0 30px rgba(124,58,237,0.5);
      z-index: 10;
    }
    #upload-btn:hover { background: #6d28d9; }
    #file-input { display: none; }
    #loading {
      display: none; position: fixed;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.85); padding: 32px 48px;
      border-radius: 16px; text-align: center;
      border: 1px solid rgba(124,58,237,0.4); z-index: 20;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #a78bfa; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.2); font-size: 14px;
      text-align: center; pointer-events: none; z-index: 5;
    }
  </style>
</head>
<body>

<div id="ui">
  <h2>🏠 Tour Virtual 3D</h2>
  <p>🖱️ Arrastrar → rotar</p>
  <p>🖱️ Scroll → zoom</p>
  <p>🖱️ Clic derecho → mover</p>
</div>

<div id="hint">Carga un archivo .splat para ver tu propiedad</div>

<div id="loading">
  <div class="spinner"></div>
  <div>Cargando escaneo 3D...</div>
</div>

<input type="file" id="file-input" accept=".splat,.ply">
<button id="upload-btn" onclick="document.getElementById('file-input').click()">
  📂 Cargar archivo .splat
</button>

<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.1/build/gaussian-splats-3d.module.js';

const viewer = new GaussianSplats3D.Viewer({
  cameraUp: [0, -1, 0],
  initialCameraPosition: [0, 0, 5],
  initialCameraLookAt: [0, 0, 0],
  rootElement: document.body,
  selfDrivenMode: true
});

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('loading').style.display = 'block';
  document.getElementById('hint').style.display = 'none';

  const url = URL.createObjectURL(file);

  try {
    await viewer.addSplatScene(url, {
      splatAlphaRemovalThreshold: 5,
      showLoadingUI: false
    });
    viewer.start();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('upload-btn').style.display = 'none';
  } catch(err) {
    document.getElementById('loading').style.display = 'none';
    alert('Error: ' + err.message);
  }
});
</script>
</body>
</html>
